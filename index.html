<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - NVR SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body
    class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="w-full max-w-md bg-zinc-900 border border-zinc-800 p-8 shadow-2xl"
    >
      <div class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-56 h-auto rounded-2xl"
        >
          <img src="NVRSystem.webp" alt="" />
        </div>
        <br /><br />
        <h1 class="text-2xl font-bold tracking-wide text-zinc-200">
          Login to System
        </h1>
        <p class="text-zinc-400 text-sm mt-1">
          Sistem Manajemen CCTV & Monitoring Live <br />
          username: admin password: nvrsystem
        </p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label
            class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2"
            >Username</label
          >
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-zinc-500"
            >
              <i class="bi bi-person-fill-gear text-lg"></i>
            </span>
            <input
              type="text"
              id="username"
              required
              placeholder="username"
              class="w-full bg-zinc-800 border border-zinc-700 pl-10 pr-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition"
            />
          </div>
        </div>

        <div>
          <label
            class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2"
            >Password</label
          >
          <div class="relative">
            <span
              class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-zinc-500"
            >
              <i class="bi bi-shield-lock-fill"></i>
            </span>
            <input
              type="password"
              id="password"
              required
              placeholder="••••••••"
              class="w-full bg-zinc-800 border border-zinc-700 pl-10 pr-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition"
            />
          </div>
        </div>
        <br />

        <button
          class="group w-full flex items-center justify-center gap-2 bg-[#00AECF] text-white px-6 py-3 font-bold transition-all duration-300"
        >
          <!-- Panah Kiri: Bergerak ke kiri saat hover -->
          <i
            class="bi bi-arrow-left-short text-2xl transition-transform duration-300 group-hover:-translate-x-8"
          ></i>

          <span>Enter</span>

          <!-- Panah Kanan: Bergerak ke kanan saat hover -->
          <i
            class="bi bi-arrow-right-short text-2xl transition-transform duration-300 group-hover:translate-x-8"
          ></i>
        </button>
      </form>
    </div>

    <script>
      // Hapus jika ada sessionStorage sebelumnya
      sessionStorage.removeItem("isLoggedIn");

      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const user = e.target.username.value;
        const pass = e.target.password.value;

        // Akun statis yang dibuat menggunakan JavaScript
        const validUsername = "admin";
        const validPassword = "nvrsystem";

        if (user === validUsername && pass === validPassword) {
          // Simpan sesi login ke browser
          sessionStorage.setItem("isLoggedIn", "true");
          // Arahkan ke dashboard
          window.location.href = "dashboard.html";
        } else {
          alert("Login Gagal: Username atau Password salah!");
        }
      });
    </script>
  </body>
</html>
